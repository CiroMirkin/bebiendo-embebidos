<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" role="img" aria-labelledby="e-1-rele-diodo-title e-1-rele-diodo-desc" id="e-1-rele-diodo-root">
  <title id="e-1-rele-diodo-title">Relé con y sin diodo</title>
  <desc id="e-1-rele-diodo-desc">Una bobina de relé de 12 V, 400 Ω y 30 mA, manejada por un BC547. Sin diodo, al cortar la corriente la bobina genera un pico de más de 50 V en el colector que puede romper el transistor. Con un diodo en paralelo con la bobina, con el cátodo hacia los 12 V, la corriente da la vuelta por el diodo y el colector sube a unos 12,7 V.</desc>
  <defs>
      <style>#e-1-rele-diodo-root { font-family: system-ui, sans-serif; color: #100f0f; }
      #e-1-rele-diodo-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  </defs>
  <rect x="0" y="0" width="600" height="352" fill="#fffcf0"/>
