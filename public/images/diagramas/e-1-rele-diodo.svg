mA</text><text x="450" y="304" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#66800b" text-anchor="middle">el transistor está a salvo</text><text x="450" y="322" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#100f0f" text-anchor="middle">al cortar, la corriente da la vuelta</text><text x="450" y="340" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="middle">por el diodo y el colector sube a 12,7 V</text><path d="M300 8 V345" fill="none" stroke="#cecdc3" stroke-width="1" stroke-dasharray="4 4"/>
