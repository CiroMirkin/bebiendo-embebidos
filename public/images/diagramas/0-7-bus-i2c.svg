<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="bus-i2c-title bus-i2c-desc" id="d-0-7-bus-i2c-root">
  <title id="bus-i2c-title">Bus I2C del controlador</title>
  <desc id="bus-i2c-desc">El ESP32-S3 usa GPIO 8 como SDA y GPIO 9 como SCL; la pantalla OLED SH1106 (0x3C) y los dos sensores SHT31 (0x44 y 0x45) se cuelgan de esas dos líneas, que tienen una resistencia de pull-up de 4,7 kΩ a 3,3 V cada una.</desc>
  <defs>
      <style>#d-0-7-bus-i2c-root { font-family: system-ui, sans-serif; color: #100f0f; }
      #d-0-7-bus-i2c-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#fffcf0"/>

  <!-- líneas del bus: primero los cables, después las cajas -->
  <g fill="none" stroke-width="2">
    <path d="M152 112 H600" stroke="#205ea6"/>
    <path d="M152 264 H600" stroke="#66800b"/>
    <!-- bajadas a cada dispositivo -->
    <path d="M296 112 V148 M424 112 V148 M552 112 V148" stroke="#205ea6"/>
    <path d="M296 228 V264 M424 228 V264 M552 228 V264" stroke="#66800b"/>
    <!-- pull-ups -->
    <path d="M200 44 V64 M200 96 V112" stroke="#205ea6"/>
    <path d="M200 264 V280 M200 312 V324" stroke="#66800b"/>
  </g>
  <g fill="#fffcf0" stroke="#100f0f" stroke-width="1.5">
    <rect x="194" y="64" width="12" height="32" rx="1"/>
    <rect x="194" y="280" width="12" height="32" rx="1"/>
  </g>
  <g>
    <circle cx="200" cy="112" r="3.5" fill="#205ea6"/>
    <circle cx="296" cy="112" r="3.5" fill="#205ea6"/>
    <circle cx="424" cy="112" r="3.5" fill="#205ea6"/>
    <circle cx="552" cy="112" r="3.5" fill="#205ea6"/>
    <circle cx="200" cy="264" r="3.5" fill="#66800b"/>
    <circle cx="296" cy="264" r="3.5" fill="#66800b"/>
    <circle cx="424" cy="264" r="3.5" fill="#66800b"/>
    <circle cx="552" cy="264" r="3.5" fill="#66800b"/>
  </g>

  <!-- etiquetas de alimentación, resistencias y líneas -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#6f6e69">
    <text x="200" y="36" text-anchor="middle">3,3 V</text>
    <text x="200" y="342" text-anchor="middle">3,3 V</text>
    <text x="214" y="84">4,7 kΩ</text>
    <text x="214" y="300">4,7 kΩ</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" font-weight="600">
    <text x="608" y="116" fill="#205ea6">SDA</text>
    <text x="608" y="268" fill="#66800b">SCL</text>
  </g>

  <!-- ESP32-S3: el maestro, único nodo destacado -->
  <rect x="16" y="88" width="136" height="200" rx="6" fill="#ffe7ce" stroke="#bc5215" stroke-width="1.5"/>
  <text x="84" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#100f0f">ESP32-S3</text>
  <text x="84" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#6f6e69">maestro</text>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#100f0f" text-anchor="end">
    <text x="144" y="116">GPIO 8</text>
    <text x="144" y="268">GPIO 9</text>
  </g>

  <!-- dispositivos -->
  <g fill="#ffffff" stroke="#100f0f" stroke-width="1">
    <rect x="240" y="148" width="112" height="80" rx="6"/>
    <rect x="368" y="148" width="112" height="80" rx="6"/>
    <rect x="496" y="148" width="112" height="80" rx="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#100f0f" text-anchor="middle">
    <text x="296" y="174">OLED SH1106</text>
    <text x="424" y="174">SHT31 norte</text>
    <text x="552" y="174">SHT31 sur</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#bc5215" text-anchor="middle">
    <text x="296" y="198">0x3C</text>
    <text x="424" y="198">0x44</text>
    <text x="552" y="198">0x45</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#6f6e69" text-anchor="middle">
    <text x="296" y="216">pantalla</text>
    <text x="424" y="216">ADDR a GND</text>
    <text x="552" y="216">ADDR a 3,3 V</text>
  </g>
</svg>
