<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="d0-5-pwm-title d0-5-pwm-desc" id="d-0-5-pwm-root">
  <title id="d0-5-pwm-title">Ciclo de trabajo del PWM</title>
  <desc id="d0-5-pwm-desc">Tres señales PWM de la misma frecuencia con ciclos de trabajo de 100, 50 y 25 %; en la de 25 %, cada ciclo de 4 ms tiene 1 ms en HIGH.</desc>
  <defs>
      <style>#d-0-5-pwm-root { font-family: system-ui, sans-serif; color: #100f0f; }
      #d-0-5-pwm-root .diagram-container { width: 100%; overflow-x: auto; }</style>
    <marker id="d-0-5-pwm-d0-5-pwm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6e69"/></marker>
    <marker id="d-0-5-pwm-d0-5-pwm-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc5215"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#fffcf0"/>
  <text x="16" y="65" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#100f0f" text-anchor="start">100 %</text>
  <path d="M96 80 H608" fill="none" stroke="#cecdc3" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M96 80 V40 H608" fill="none" stroke="#205ea6" stroke-width="2"/>
  <text x="16" y="145" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#100f0f" text-anchor="start">50 %</text>
  <path d="M96 160 H608" fill="none" stroke="#cecdc3" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M96 160 V120 H160.0 V160 H224 V120 H288.0 V160 H352 V120 H416.0 V160 H480 V120 H544.0 V160 H608" fill="none" stroke="#205ea6" stroke-width="2"/>
  <text x="16" y="225" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#100f0f" text-anchor="start">25 %</text>
  <path d="M96 240 H608" fill="none" stroke="#cecdc3" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M96 240 V200 H128.0 V240 H224 V200 H256.0 V240 H352 V200 H384.0 V240 H480 V200 H512.0 V240 H608" fill="none" stroke="#205ea6" stroke-width="2"/>
  <text x="88" y="44" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="end">HIGH</text>
  <text x="88" y="84" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="end">LOW</text>
  <path d="M96 260 V268 M96 264 H224 M224 260 V268" fill="none" stroke="#100f0f" stroke-width="1"/>
  <text x="160.0" y="286" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#100f0f" text-anchor="middle">1 ciclo: 4 ms</text>
  <path d="M96 188 V196 M96 192 H128 M128 188 V196" fill="none" stroke="#bc5215" stroke-width="1"/>
  <text x="136" y="196" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#bc5215" text-anchor="start">1 ms en HIGH</text>
</svg>
