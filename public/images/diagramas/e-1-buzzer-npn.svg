  <title id="de-1-buzzer-npn-title">Buzzer de 12 V con un NPN</title>
  <desc id="de-1-buzzer-npn-desc">Un BC547 del lado bajo maneja un buzzer de 12 V y 30 mA desde el GPIO 2: 680 Ω de resistencia de base y 47 kΩ de base a masa. Con el GPIO en alto entran unos 3,8 mA por la base y pasan 30 mA por el colector.</desc>
