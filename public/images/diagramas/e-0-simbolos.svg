<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="de-0-simbolos-title de-0-simbolos-desc" id="e-0-simbolos-root">
  <title id="de-0-simbolos-title">Símbolos de un esquemático</title>
  <desc id="de-0-simbolos-desc">Ocho símbolos de esquemático: resistencia, capacitor, diodo, LED, transistor NPN, fuente, masa y cruce de cables. Dos cables que se cruzan con un punto están unidos; sin punto, pasan sin tocarse.</desc>
