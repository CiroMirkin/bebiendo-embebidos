  <title id="d0-10-peticion-http-title">Peticiones HTTP del controlador</title>
  <desc id="d0-10-peticion-http-desc">Cada minuto el controlador envía las lecturas con un POST y cada 10 minutos pide el umbral de riego con un GET; mientras espera cada respuesta, loop() queda detenido.</desc>
