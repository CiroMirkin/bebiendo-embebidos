<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 440" role="img" aria-labelledby="de-2-llave-5v-no-corta-title de-2-llave-5v-no-corta-desc" id="e-2-llave-5v-no-corta-root">
  <title id="de-2-llave-5v-no-corta-title">Por qué el GPIO solo no corta una llave de 5 V</title>
  <desc id="de-2-llave-5v-no-corta-desc">Dos llaves de 5 V con AO3401 lado a lado. A la izquierda el GPIO de 3,3 V maneja el gate directo: con el GPIO en alto el gate queda cerca de 3,3 V, VGS vale unos -1,7 V, más que el umbral de -0,9 V, y la carga sigue recibiendo 4,99 V. A la derecha un BC547 lleva el gate a masa: con el GPIO en bajo el gate queda en 5 V, VGS vale 0 y la carga recibe 0 V. Abajo una escala de VGS muestra dónde cae cada caso respecto del umbral.</desc>
