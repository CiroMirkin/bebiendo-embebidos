<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" role="img" aria-labelledby="de-0-protoboard-title de-0-protoboard-desc" id="e-0-protoboard-root">
  <title id="de-0-protoboard-title">Del esquemático a la protoboard</title>
  <desc id="de-0-protoboard-desc">El mismo circuito en dos dibujos. En el esquemático, GPIO 2, resistencia de 330 Ω, LED y GND en serie. En la protoboard, cada columna de cinco agujeros es un nodo: el cable del GPIO 2 y la resistencia comparten la columna 1, la resistencia y el LED la 2, y el LED y el cable a GND la 3.</desc>
