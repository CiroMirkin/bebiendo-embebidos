<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="de-5-tester-conexiones-title de-5-tester-conexiones-desc" id="e-5-tester-conexiones-root">
  <title id="de-5-tester-conexiones-title">El tester y sus tres conexiones</title>
  <desc id="de-5-tester-conexiones-desc">Un tester dibujado de frente, con la pantalla, la perilla y los cuatro bornes: COM, V/Ω, mA y 10 A. A la derecha, tres formas de conectarlo. Tensión: en paralelo con la carga, sin abrir el circuito, punta roja en V/Ω. Corriente: en serie, abriendo el cable de alimentación y cerrándolo a través del tester, punta roja en mA. Continuidad: con la placa desenchufada y sin ninguna fuente, entre 3,3 V y masa; si suena, hay un corto.</desc>
