  <title id="d0-1-tareas-millis-title">Tres tareas con millis()</title>
  <desc id="d0-1-tareas-millis-desc">En cada vuelta de loop() se atiende el botón; la pantalla se actualiza cada 500 ms y los sensores se leen cada 2000 ms, sin que ninguna tarea espere a otra.</desc>
