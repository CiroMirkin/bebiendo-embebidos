  <title id="d0-6-trama-uart-title">Un byte por UART</title>
  <desc id="d0-6-trama-uart-desc">La línea está en HIGH en reposo; el bit de inicio la baja a LOW, siguen los 8 bits del byte 0x41 empezando por el bit 0, y el bit de parada la vuelve a HIGH.</desc>
