<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img" aria-labelledby="e-1-patas-reales-title e-1-patas-reales-desc" id="e-1-patas-reales-root">
  <title id="e-1-patas-reales-title">Patas del BC547 y del AO3401</title>
  <desc id="e-1-patas-reales-desc">Dibujo de los dos transistores como se ven. El BC547 en encapsulado TO-92, visto de frente con la cara plana hacia vos, tiene de izquierda a derecha colector, base y emisor. El AO3401 en encapsulado SOT-23, visto desde arriba, tiene el drain en la pata sola de arriba, el gate abajo a la izquierda y el source abajo a la derecha.</desc>
  <defs>
      <style>#e-1-patas-reales-root { font-family: system-ui, sans-serif; color: #100f0f; }
      #e-1-patas-reales-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  </defs>
  <rect x="0" y="0" width="600" height="345" fill="#fffcf0"/>
