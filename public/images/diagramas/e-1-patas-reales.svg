anchor="middle">pata 2</text><circle cx="202" cy="278" r="12" fill="#bc5215"/><text x="202" y="283" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#fffcf0" text-anchor="middle">E</text><text x="202" y="304" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">emisor</text><text x="202" y="318" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">pata 3</text><text x="450" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#100f0f" text-anchor="middle">AO3401 (SOT-23)</text><text x="450" y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="middle">desde arriba, con la pata sola arriba</text><rect x="441" y="74" width="18" height="26" rx="2" fill="#cecdc3" stroke="#878580" stroke-width="1.5"/><rect x="407" y="168" width="18" height="26" rx="2" fill="#cecdc3" stroke="#878580" stroke-width="1.5"/><rect x="475" y="168" width="18" height="26" rx="2" fill="#cecdc3" stroke="#878580" stroke-width="1.5"/><rect x="388" y="98" width="124" height="74" rx="6" fill="#2b2a28" stroke="#100f0f" stroke-width="2"/><circle cx="402" cy="158" r="4" fill="#575653"/><text x="450" y="130" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#fffcf0" text-anchor="middle">AO3401</text><text x="450" y="150" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#cecdc3" text-anchor="middle">P-MOSFET</text><circle cx="416" cy="218" r="12" fill="#bc5215"/><text x="416" y="223" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#fffcf0" text-anchor="middle">G</text><text x="416" y="244" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">gate</text><text x="416" y="258" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">pata 1</text><circle cx="484" cy="218" r="12" fill="#bc5215"/><text x="484" y="223" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#fffcf0" text-anchor="middle">S</text><text x="484" y="244" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">source</text><text x="484" y="258" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="middle">pata 2</text><circle cx="486" cy="87" r="12" fill="#bc5215"/><text x="486" y="92" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#fffcf0" text-anchor="middle">D</text><text x="504" y="91" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#6f6e69" text-anchor="start">drain, pata 3</text><path d="M300 8 V335" fill="none" stroke="#cecdc3" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
