<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="de-2-llave-5v-title de-2-llave-5v-desc" id="e-2-llave-5v-root">
  <title id="de-2-llave-5v-title">Llave de 5 V con P-MOSFET y NPN</title>
  <desc id="de-2-llave-5v-desc">Un AO3401 corta los 5 V después de un fusible de 0,25 A, con un pull-up de 10 kΩ en el gate. Un BC547 lleva el gate a masa: su base recibe el GPIO por 4,7 kΩ y tiene 47 kΩ a masa. La salida lleva 100 µF a masa. Con el GPIO en alto la carga se prende; en bajo o flotando queda apagada.</desc>
