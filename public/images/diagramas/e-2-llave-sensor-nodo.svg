<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" role="img" aria-labelledby="de-2-llave-sensor-nodo-title de-2-llave-sensor-nodo-desc" id="e-2-llave-sensor-nodo-root">
  <title id="de-2-llave-sensor-nodo-title">Llave del sensor de suelo del nodo</title>
  <desc id="de-2-llave-sensor-nodo-desc">Un AO3401 con el source en 3,3 V corta el positivo del sensor de suelo. Un pull-up de 100 kΩ deja el gate en 3,3 V, 10 kΩ lo unen al GPIO 25 y 47 nF van entre gate y drain. Con el GPIO en bajo el gate baja a 0,3 V y el sensor se prende; en alto o flotando queda cortado.</desc>
  <defs>
      <style>#e-2-llave-sensor-nodo-root { font-family: system-ui, sans-serif; color: #100f0f; }
      #e-2-llave-sensor-nodo-root .diagram-container { width: 100%; overflow-x: auto; }</style>
