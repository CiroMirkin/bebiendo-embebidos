  <rect x="340" y="136" width="224" height="76" rx="6" fill="#ffffff" stroke="#100f0f" stroke-width="1"/>
  <text x="356" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#100f0f" text-anchor="start">alto o flotando</text>
