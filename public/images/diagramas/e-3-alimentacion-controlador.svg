  <title id="de-3-alimentacion-controlador-title">Alimentación del controlador</title>
  <desc id="de-3-alimentacion-controlador-desc">La fuente de 12 V y 5 A entra por un fusible lento de 4 A y un diodo Schottky. Después van un electrolítico de 470 µF y un cerámico de 100 nF a masa, las cargas de 12 V (bomba, ventilador y cortina) y un step-down de 12 V a 5 V con 100 µF a la salida, que alimenta al ESP32-S3. En naranja, el camino de la corriente de la bomba: sale por el +12 V y vuelve a la fuente por la masa.</desc>
